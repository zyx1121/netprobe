name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runner public IP
        run: curl -s https://ipinfo.io/json | grep -E '"ip"|"country"|"org"'
      - name: HTTPS reachability
        run: |
          curl -s -o /dev/null -w "meet %{http_code} %{time_total}s\n" https://meet.winlab.tw
          curl -s -o /dev/null -w "livekit %{http_code} %{time_total}s\n" https://livekit.winlab.tw
      - name: Join and publish (WebRTC media)
        env:
          TOKEN: ${{ secrets.LK_TOKEN }}
          LK_URL: wss://livekit.winlab.tw
        run: |
          pip install -q livekit
          sudo tcpdump -nqi any -w /tmp/u.pcap "udp and host 140.113.60.184" &
          sleep 2
          python probe.py || true
          sudo pkill tcpdump; sleep 1
          echo "== packets by direction and remote port"
          sudo tcpdump -nqr /tmp/u.pcap 2>/dev/null | awk '{print $3, $5}' | sed -E 's/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.([0-9]+) /\1 /; s/:$//' | awk '{ if ($1 ~ /^140/) print "IN from", $1; else print "OUT to", $2 }' | sed -E 's/140\.113\.60\.184\./184:/' | sort | uniq -c | sort -rn | head -20
