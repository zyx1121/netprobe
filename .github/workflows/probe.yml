name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runner public IP
        run: curl -s https://ipinfo.io/json | grep -E '"ip"|"country"|"org"'
      - name: HTTPS reachability
        run: |
          curl -s -o /dev/null -w "meet %{http_code} %{time_total}s\n" https://meet.winlab.tw
          curl -s -o /dev/null -w "livekit %{http_code} %{time_total}s\n" https://livekit.winlab.tw
      - name: Join and publish (WebRTC media)
        env:
          TOKEN: ${{ secrets.LK_TOKEN }}
          LK_URL: wss://livekit.winlab.tw
        run: |
          pip install -q livekit
          python probe.py
